[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind"
version = "0.1.0"
description = "CPU-first, uncertainty-aware multilingual speech intelligence prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "soundfile>=0.12,<1",
  "pydantic>=2.5,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0,<2"]
ui = ["gradio>=4.44,<6", "plotly>=5.18,<7"]
science = ["scipy>=1.11,<2", "scikit-learn>=1.4,<2", "jiwer>=3,<5", "pandas>=2,<3", "huggingface_hub>=0.24,<1", "requests>=2.31,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echomind.api" = ["static/*.png"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
